<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>TaskMaster - Admin</title>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="square-check" data-lucide="square-check-big"></span>
            <h1>TaskMaster</h1>
        </div>
        <div class="sidebar-menu">
            <button class="button-menu marcado" onclick="navigate('dashboard', this)">
                <span data-lucide="layout-dashboard"></span>
                <span>Dashboard</span>
            </button>
            <button class="button-menu" onclick="navigate('users', this)">
                <span data-lucide="users"></span>
                <span>Users</span>
            </button>
        </div>
        <div class="sidebar-footer">
            <div class="sidebar-admin">
                <span>A</span>
                <div class="admin">
                    <span>Administrador</span>
                    <span>Admin</span>
                </div>
            </div>
            <button class="log-out">
                <span data-lucide="log-out"></span>
                <span>Log out</span>
            </button>
        </div>
    </aside>
    <main id="app"></main>
    <script src="script.js"></script>
</body>
</html>
